{% extends "base_public.html" %}
{% block title %}Password Reset Complete — Crime Data Analysis System{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card text-center">
    <div class="auth-logo mb-3" style="background: linear-gradient(135deg, #16A36A, #12875a);">
      <i class="bi bi-shield-check"></i>
    </div>
    <h2 class="auth-title">Password Reset Complete</h2>
    <p class="auth-subtitle mb-4">
      Your password has been successfully reset. You can now log in with your new password.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100">
      <i class="bi bi-box-arrow-in-right me-2"></i>Log In Now
    </a>
  </div>
</div>
{% endblock %}
